<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;overflow:hidden}
.gold{color:#FFD700;font-weight:900}
@keyframes move{0%{transform:translateY(100vh)}100%{transform:translateY(-100vh)}}
@keyframes shine{0%{text-shadow:0 0 10px gold}50%{text-shadow:0 0 30px gold,0 0 50px gold}100%{text-shadow:0 0 10px gold}}
.slide{position:absolute;width:100%;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;animation:move 25s linear infinite;background:linear-gradient(#000,#111)}
h1{font-size:70px;animation:shine 2s infinite}
.box{border:2px solid gold;padding:20px;margin:10px;border-radius:15px;background:rgba(212,175,55,0.1)}
</style></head><body>
<div class="slide">
<h1 class="gold">BRAZIL GOLD</h1>
<p style="letter-spacing:8px;color:gold">From Brazil to Morocco</p>
<div class="box">✈️ AIR CARGO 5 DAYS - 10L = 14,000 DH</div>
<div class="box">🚢 OCEAN CARGO 25 DAYS - 100L = 140,000 DH</div>
<div class="box">5 BRANDS: Inoar • Felps • Let Me Be • Boris • Prohall</div>
<h2 class="gold">START WITH 10L BY PLANE<br>THEN 100L BY SHIP</h2>
<p>Business d'Or Morocco - Casablanca</p>
</div>
</body></html>
